  <script>

    try { var t = localStorage.getItem('wonder.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script type="module" src="/app.js"></script>

    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <div id="demo-banner" class="demo-banner" hidden role="status"></div>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

</html>
